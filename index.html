/* keyboard */
document.addEventListener('keydown',function(e){
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();return openPalette()}
  if(e.key==='Escape'){
    const c=document.getElementById('capScrim'); if(c)return c.remove();
    const p=document.getElementById('paletteScrim'); if(p)return closePalette();
    const s=document.getElementById('sheetScrim'); if(s)return closeSheet();
    if(selectedId)return closeDetail();
    return;
  }
  if(typing)return;
  const dialogOpen=document.getElementById('sheetScrim')||document.getElementById('paletteScrim')||document.getElementById('capScrim');
  if(e.key.toLowerCase()==='n'&&e.shiftKey&&!dialogOpen){e.preventDefault();return openCapture()}
  if(e.key==='/'){e.preventDefault();query='';return go('search')}
  if(e.key==='c'){ctx=ctx==='work'?'life':'work';projFilter=null;return render()}
  const i=['1','2','3','4','5','6'].indexOf(e.key);
  if(i>-1)go(NAV[i].id);
});

/* data */
function download(obj,name){
  const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
function doExport(){download(S,'planner-'+iso(new Date())+'.json'); toast('Backup downloaded')}
function exportRoutes(){
  const pend=live().filter(t=>!t.routed&&t.route!=='task'&&t.status!=='done').map(t=>({
    id:t.id,title:t.title,destination:ROUTES[t.route],type:t.route,
    due:t.due,context:t.context,priority:t.priority,notes:t.notes}));
  if(!pend.length)return toast('Nothing to export');
  download(pend,'routes-'+iso(new Date())+'.json'); toast(pend.length+' items exported');
}
document.getElementById('expBtn').onclick=doExport;
document.getElementById('impBtn').onclick=function(){document.getElementById('impFile').click()};
document.getElementById('impFile').onchange=function(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result); if(!d.tasks)throw new Error('bad');
      S=migrate(d); save(); render(); toast('Restored '+d.tasks.length+' tasks');
    }catch(err){toast('That file isn\u2019t a planner backup')}
  };
  r.readAsText(f); e.target.value='';
};

/* ══════════════════════════════════════════════════════════
   GOOGLE — read-only Calendar + Tasks, merged into the views.
   Writing back happens later, from the iPhone Shortcut, not here.
   Calendars are individually assignable to Professional / Personal /
   hidden — useful when a work Outlook calendar has been imported as
   a secondary calendar into this Google account.
   ══════════════════════════════════════════════════════════ */
let gCalendars=[];   // [{id,name,map:'work'|'life'|''}]
function gLoadMap(){
  try{ return JSON.parse(localStorage.getItem('planner.gcalmap')||'{}'); }catch(e){ return {}; }
}
function gSaveMap(map){
  try{ localStorage.setItem('planner.gcalmap',JSON.stringify(map)); }catch(e){}
}
function gInit(){
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){setTimeout(gInit,300);return}
  gTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID, scope:GOOGLE_SCOPES,
    callback:function(resp){
      const wasSilent=gSilentAttempt; gSilentAttempt=false;
      if(resp.error){
        if(wasSilent){gStatus='expired';renderGoogleBox();return} // quiet refresh failed — let the user reconnect when they notice
        gStatus='error';renderGoogleBox();toast('Google sign-in failed — try again');return;
      }
      gToken={access_token:resp.access_token,expires_at:Date.now()+(resp.expires_in*1000)};
      try{localStorage.setItem('planner.gtoken',JSON.stringify(gToken))}catch(e){}
      gStatus='on'; scheduleTokenRefresh(); gFetch(); syncOnConnect();
    }
  });
  try{
    const c=JSON.parse(localStorage.getItem('planner.gtoken')||'null');
    if(c&&c.expires_at>Date.now()+60000){gToken=c;gStatus='on';scheduleTokenRefresh();gFetch();syncOnConnect()}
  }catch(e){}
  renderGoogleBox();
}
function scheduleTokenRefresh(){
  clearTimeout(refreshTimer);
  if(!gToken)return;
  const delay=Math.max(15000, gToken.expires_at-Date.now()-5*60000); // renew ~5min before it expires
  refreshTimer=setTimeout(function(){
    if(!gTokenClient)return;
    gSilentAttempt=true;
    gTokenClient.requestAccessToken({prompt:''});
  },delay);
}
function gConnect(){
  if(!gTokenClient){toast('Still loading Google sign-in — try again in a second');return}
  gStatus='connecting'; renderGoogleBox();
  gTokenClient.requestAccessToken({prompt: gToken?'':'consent'});
}
function gDisconnect(){
  gToken=null; gStatus='off'; gItems=[]; gCalendars=[];
  try{localStorage.removeItem('planner.gtoken')}catch(e){}
  stopSync();
  renderGoogleBox(); renderListOnly();
}
function gExpired(){
  gToken=null; gStatus='expired'; gItems=[];
  try{localStorage.removeItem('planner.gtoken')}catch(e){}
  stopSync();
  renderGoogleBox(); renderListOnly();
}
async function gListCalendars(){
  const res=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250',
    {headers:{Authorization:'Bearer '+gToken.access_token}});
  if(res.status===401)return gExpired();
  if(!res.ok)return [];
  const data=await res.json();
  return (data.items||[]).map(c=>({id:c.id,name:c.summaryOverride||c.summary||c.id,primary:!!c.primary}));
}
async function gFetch(){
  if(!gToken)return;
  gStatus='syncing'; renderGoogleBox();
  try{
    const list=await gListCalendars();
    if(gStatus==='expired')return;
    const map=gLoadMap();
    // first time: default the primary calendar to Personal, leave everything else unmapped
    let mapChanged=false;
    list.forEach(c=>{ if(!(c.id in map)){ map[c.id]=c.primary?'life':''; mapChanged=true; } });
    if(mapChanged)gSaveMap(map);
    gCalendars=list.map(c=>({id:c.id,name:c.name,map:map[c.id]||''}));

    const timeMin=addD(today(),-14).toISOString(), timeMax=addD(today(),84).toISOString();
    const active=gCalendars.filter(c=>c.map==='work'||c.map==='life');
    const results=await Promise.all(active.map(async c=>{
      try{
        const res=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(c.id)+'/events?'+
          'timeMin='+encodeURIComponent(timeMin)+'&timeMax='+encodeURIComponent(timeMax)+
          '&singleEvents=true&orderBy=startTime&maxResults=250',
          {headers:{Authorization:'Bearer '+gToken.access_token}});
        if(res.status===401){gExpired();return[]}
        if(!res.ok)return[];
        const data=await res.json();
        return (data.items||[]).filter(e=>e.status!=='cancelled').map(e=>({
          id:'g-ev-'+c.id+'-'+e.id, kind:'event', context:c.map,
          title:e.summary||'(untitled event)',
          due:(e.start&&(e.start.date||(e.start.dateTime||'').slice(0,10)))||null,
          time:e.start&&e.start.dateTime?new Date(e.start.dateTime).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):null,
          link:e.htmlLink||null
        })).filter(e=>e.due);
      }catch(e){ return []; }
    }));
    const events=[].concat.apply([],results);

    const tkRes=await fetch('https://www.googleapis.com/tasks/v1/lists/@default/tasks?showCompleted=false&maxResults=100',
      {headers:{Authorization:'Bearer '+gToken.access_token}});
    let tasksArr=[];
    if(tkRes.status===401)return gExpired();
    if(tkRes.ok){
      const tkData=await tkRes.json();
      tasksArr=(tkData.items||[]).filter(t=>t.status!=='completed').map(t=>({
        id:'g-tk-'+t.id, kind:'task', context:'life', title:t.title||'(untitled task)',
        due:t.due?t.due.slice(0,10):null, time:null, link:null
      })).filter(t=>t.due);
    }
    gItems=events.concat(tasksArr);
    gStatus='on'; renderGoogleBox(); renderListOnly();
  }catch(err){
    console.warn('Google fetch failed',err); gStatus='error'; renderGoogleBox();
  }
}
function gPickCalendars(){
  if(!gCalendars.length){toast('Nothing to choose yet — connect first');return}
  sheet({title:'Choose calendars',
    body:'<p class="sub" style="margin:0">Assign each calendar you have access to. Anything left \u201cDon\u2019t show\u201d is skipped entirely \u2014 useful for calendars you\u2019ve subscribed to but don\u2019t want cluttering either tab.</p>'+
      '<div class="subs">'+gCalendars.map(c=>
        '<div style="display:flex;align-items:center;gap:9px"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px">'+esc(c.name)+'</span>'+
        '<select data-gcal="'+esc(c.id)+'" style="border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;background:var(--surface)">'+
        '<option value=""'+(c.map===''?' selected':'')+'>Don\u2019t show</option>'+
        '<option value="work"'+(c.map==='work'?' selected':'')+'>Professional</option>'+
        '<option value="life"'+(c.map==='life'?' selected':'')+'>Personal</option>'+
        '</select></div>').join('')+
      '</div>',
    saveLabel:'Save & refresh',
    onSave:function(el){
      const map=gLoadMap();
      el.querySelectorAll('[data-gcal]').forEach(function(sel){ map[sel.dataset.gcal]=sel.value; });
      gSaveMap(map); gFetch();
    }});
}
/* ══════════════════════════════════════════════════════════
   SYNC — cross-device sync via a hidden file in the user's own
   Google Drive (the "appDataFolder", invisible in their normal
   Drive UI). Piggybacks on the same Google sign-in used above
   for Calendar/Tasks, so connecting once covers both. Plain
   last-write-wins by S.updatedAt: a device that has never saved
   locally (a fresh browser, still on seed data) always defers to
   whatever is already in Drive instead of overwriting it.
   ══════════════════════════════════════════════════════════ */
const DRIVE_FILE_NAME='planner-data.json';
function driveHeaders(extra){
  const h={Authorization:'Bearer '+gToken.access_token};
  return extra?Object.assign(h,extra):h;
}
async function driveFindFile(){
  const res=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder'+
    '&q='+encodeURIComponent("name='"+DRIVE_FILE_NAME+"' and trashed=false")+
    '&fields=files(id)&pageSize=1',{headers:driveHeaders()});
  if(res.status===401){gExpired();return null}
  if(!res.ok)throw new Error('drive list failed ('+res.status+')');
  const data=await res.json();
  return (data.files&&data.files[0])||null;
}
async function driveDownload(id){
  const res=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:driveHeaders()});
  if(res.status===401){gExpired();return null}
  if(res.status===404)return null;
  if(!res.ok)throw new Error('drive download failed ('+res.status+')');
  return res.json();
}
async function driveUpload(existingId,body){
  const json=JSON.stringify(body);
  if(existingId){
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+existingId+'?uploadType=media',
      {method:'PATCH',headers:driveHeaders({'Content-Type':'application/json'}),body:json});
    if(res.status===401){gExpired();return null}
    if(res.status===404)return driveUpload(null,body); // file was removed out-of-band — recreate it
    if(!res.ok)throw new Error('drive upload failed ('+res.status+')');
    return existingId;
  }
  const meta={name:DRIVE_FILE_NAME,parents:['appDataFolder']};
  const boundary='pmp'+Math.random().toString(36).slice(2);
  const multipart='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n'+
    '--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+json+'\r\n--'+boundary+'--';
  const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    {method:'POST',headers:driveHeaders({'Content-Type':'multipart/related; boundary='+boundary}),body:multipart});
  if(res.status===401){gExpired();return null}
  if(!res.ok)throw new Error('drive create failed ('+res.status+')');
  const data=await res.json();
  return data.id;
}
function rememberDriveFileId(id){
  driveFileId=id;
  try{ if(id)localStorage.setItem('planner.driveFileId',id); else localStorage.removeItem('planner.driveFileId'); }catch(e){}
}
async function syncPull(){
  if(!gToken)return;
  syncState='pulling'; renderGoogleBox();
  try{
    const file=driveFileId?{id:driveFileId}:await driveFindFile();
    if(!gToken)return; // expired mid-request
    if(!file)return syncPushNow(); // nothing in Drive yet — this device's copy becomes the baseline
    rememberDriveFileId(file.id);
    const remote=await driveDownload(file.id);
    if(!gToken)return;
    if(remote&&remote.tasks){
      const remoteTime=remote.updatedAt?Date.parse(remote.updatedAt):0;
      const localTime=S.updatedAt?Date.parse(S.updatedAt):0;
      if(remoteTime>localTime){
        S=migrate(remote); Store.set(S); render();
        if(localTime)toast('Synced from another device');
      } else if(localTime>remoteTime){
        return syncPushNow();
      }
    } else {
      return syncPushNow();
    }
    syncedAt=new Date(); syncState='synced'; renderGoogleBox();
  }catch(err){
    console.warn('sync pull failed',err); syncState='error'; renderGoogleBox();
  }
}
async function syncPushNow(){
  if(!gToken)return;
  clearTimeout(pushTimer);
  syncState='pushing'; renderGoogleBox();
  try{
    const id=await driveUpload(driveFileId,S);
    if(!gToken)return; // expired mid-request
    rememberDriveFileId(id);
    syncedAt=new Date(); syncState='synced'; renderGoogleBox();
  }catch(err){
    console.warn('sync push failed',err); syncState='error'; renderGoogleBox();
  }
}
function queueDrivePush(){
  if(!gToken)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(syncPushNow,2500);
}
function syncOnConnect(){
  syncPull();
  clearInterval(pollTimer);
  pollTimer=setInterval(function(){ if(gToken&&document.visibilityState==='visible')syncPull(); },60000);
}
function stopSync(){
  clearTimeout(pushTimer); clearInterval(pollTimer); clearTimeout(refreshTimer);
  syncState='idle'; syncedAt=null;
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&gToken&&gStatus==='on')syncPull();
});
function relTime(d){
  const s=Math.round((Date.now()-d.getTime())/1000);
  if(s<10)return'just now'; if(s<60)return s+'s ago';
  const m=Math.round(s/60); if(m<60)return m+'m ago';
  const h=Math.round(m/60); if(h<24)return h+'h ago';
  return Math.round(h/24)+'d ago';
}
function syncLabel(){
  if(syncState==='pulling')return'Pulling latest&hellip;';
  if(syncState==='pushing')return'Syncing&hellip;';
  if(syncState==='error')return'Sync error &mdash; will retry';
  if(syncedAt)return'Synced '+relTime(syncedAt);
  return'Not yet synced';
}
function renderGoogleBox(){
  const el=document.getElementById('gWrap'); if(!el)return;
  const label={off:'Not connected',connecting:'Connecting&hellip;',syncing:'Syncing&hellip;',
    on:'Connected'+(gItems.length?' &middot; '+gItems.length+' items':''),
    error:'Connection failed',expired:'Session expired'}[gStatus]||'Not connected';
  el.innerHTML='<span class="eyebrow">Google</span><div class="gbox">'+
    '<div class="grow"><span class="gdot '+(gStatus==='on'?'on':(gStatus==='error'||gStatus==='expired'?'err':''))+'"></span>'+label+'</div>'+
    (gStatus==='on'?'<div class="sub" style="margin:2px 0 0;font-size:11px">'+syncLabel()+'</div>':'')+
    (gStatus==='on'
      ? '<button class="gbtn" id="gBtn">Refresh &amp; disconnect&hellip;</button>'
      : '<button class="gbtn" id="gBtn">Connect Google account</button>')+
    (gStatus==='on'?'<button class="gbtn" id="gPickBtn" style="margin-top:5px">Choose calendars&hellip;</button>':'')+
    '</div>';
  document.getElementById('gBtn').onclick=function(){
    if(gStatus==='on'){
      sheet({title:'Google account',
        body:'<p class="sub" style="margin:0">Reads Calendar and Tasks (read-only), and syncs your planner data across your devices via a hidden file in your own Google Drive &mdash; nobody else can see it. '+
          'Disconnecting only removes access here; nothing changes in Google, and your data stays on this device.</p>',
        saveLabel:'Sync now', onSave:function(){gFetch(); syncPull()}, onDel:gDisconnect});
      const s=document.getElementById('sheetScrim');
      const delBtn=s.querySelector('[data-del]'); if(delBtn)delBtn.textContent='Disconnect';
    } else gConnect();
  };
  const pb=document.getElementById('gPickBtn'); if(pb)pb.onclick=gPickCalendars;
}
function gRowHTML(it){
  return '<div class="row" data-gid="'+it.id+'">'+
    '<div class="check" style="visibility:hidden"></div><div class="rbody">'+
    '<div class="title">'+esc(it.title)+'</div><div class="meta">'+
    '<span class="pill gsrc">Google '+(it.kind==='event'?'event':'task')+'</span>'+
    '<span class="pill ctx">'+(it.context==='work'?'Prof':'Pers')+'</span>'+
    (it.time?'<span>'+it.time+'</span>':(it.due?'<span>'+relDue(it.due)+'</span>':''))+
    '</div></div></div>';
}
function openGoogleItem(id){
  const it=gItems.filter(x=>x.id===id)[0]; if(!it)return;
  sheet({title:'From Google',
    body:'<div class="f"><label>Title</label><p style="margin:0;font-size:15px;font-weight:500">'+esc(it.title)+'</p></div>'+
      '<div class="f"><label>When</label><p style="margin:0">'+relDue(it.due)+(it.time?' &middot; '+it.time:'')+'</p></div>'+
      '<p class="sub" style="margin:0">This lives in Google, so it&rsquo;s read-only here. Edit it in Google Calendar or Google Tasks directly.</p>',
    saveLabel: it.link?'Open in Google':null,
    onSave: it.link?function(){window.open(it.link,'_blank')}:null
  });
}

let tto;
function toast(m){
  const el=document.getElementById('toast');
  el.textContent=m; el.classList.add('show');
  clearTimeout(tto); tto=setTimeout(function(){el.classList.remove('show')},2400);
}
let rz;
window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(render,180)});

load().then(function(){
  render();
  gInit();
  if(Store.mode==='memory')toast('Storage unavailable — use Download backup to keep your data');
});
</script>
