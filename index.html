<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#094B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>Planner</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --ink:#171C22; --surface:#FFF; --bg:#EDF0F2;
  --line:#DAE0E5; --soft:#E9EDF0; --muted:#6A757F;
  --danger:#A62B22; --warn:#8A5A0B; --ok:#2E6B45;
  --accent:#0E6B70; --deep:#094B4F; --tint:#E0EFEF;
  --r:7px; --shadow:0 1px 2px rgba(23,28,34,.06),0 4px 14px rgba(23,28,34,.07);
  --label:600 11px/1 "Archivo Narrow","Arial Narrow",sans-serif;
  --safe:env(safe-area-inset-bottom,0px);
}
:root[data-ctx="life"]{--accent:#8A2E5D;--deep:#632042;--tint:#F6E7EE}
:root[data-theme="dark"]{
  --ink:#E8EBEE; --surface:#1B1F24; --bg:#131619;
  --line:#2C3238; --soft:#262B31; --muted:#8A939C;
  --danger:#E5776C; --warn:#E0AC5C; --ok:#6FBF8B;
  --accent:#28A0A6; --deep:#0E6B70; --tint:#173538;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
}
:root[data-theme="dark"][data-ctx="life"]{--accent:#C25490;--deep:#8A2E5D;--tint:#33202C}
:root[data-theme="dark"] .topbar{background:#0C1214}
:root[data-theme="dark"] .pill,:root[data-theme="dark"] .bg,:root[data-theme="dark"] .ct{background:var(--soft)}
:root[data-theme="dark"] .pill.late,:root[data-theme="dark"] .pill.p3{background:#3A211E}
:root[data-theme="dark"] .pill.p2{background:#3A2E14}
:root[data-theme="dark"] .pill.rt{background:#1F2036}
:root[data-theme="dark"] .pill.rep{background:#173424}
:root[data-theme="dark"] .day.out{background:#16191C}
:root[data-theme="dark"] .tlcell.we{background:#181C20}
:root[data-theme="dark"] .empty,:root[data-theme="dark"] .panel{background:var(--surface)}
:root[data-theme="dark"] input,:root[data-theme="dark"] textarea,:root[data-theme="dark"] select{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 14.5px/1.5 "Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.eyebrow{font:var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
::selection{background:var(--tint)}

/* ═══ shell: sidebar | list | detail ═══ */
.app{display:grid;grid-template-columns:212px 1fr 360px;grid-template-rows:auto 1fr;height:100dvh}
.app.no-detail{grid-template-columns:212px 1fr 0}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;height:50px;
  background:var(--deep);color:#fff;transition:background .3s}
.brand{font:700 14px/1 "Archivo Narrow",sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.9}
.switch{display:flex;background:rgba(255,255,255,.13);border-radius:999px;padding:3px;gap:2px}
.switch button{font:var(--label);letter-spacing:.1em;text-transform:uppercase;padding:6px 13px;
  border-radius:999px;color:rgba(255,255,255,.72);transition:.18s;white-space:nowrap}
.switch button[aria-pressed=true]{background:#fff;color:var(--deep)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.ghost{font:var(--label);letter-spacing:.1em;text-transform:uppercase;padding:7px 11px;border-radius:var(--r);
  color:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.22);transition:.15s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ghost:hover{background:rgba(255,255,255,.12);color:#fff}
.kbd{font:600 10px/1 "Archivo Narrow",sans-serif;border:1px solid rgba(255,255,255,.32);
  border-radius:3px;padding:2px 4px;opacity:.75}

/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:13px 9px;
  overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.navrow{display:flex;flex-direction:column;gap:1px}
.navrow button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;
  border-radius:var(--r);font-size:13.5px;font-weight:500;transition:.12s}
.navrow button:hover{background:var(--bg)}
.navrow button[aria-current=true]{background:var(--tint);color:var(--deep);font-weight:600}
.ct{margin-left:auto;font:600 10.5px/1 "Archivo Narrow",sans-serif;color:var(--muted);
  background:var(--bg);border-radius:999px;padding:3px 6px;min-width:20px;text-align:center}
.navrow button[aria-current=true] .ct{background:#fff;color:var(--deep)}
.ct.hot{background:#F7E4E2;color:var(--danger)}
.ico{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.sec>.eyebrow{padding:0 9px 6px;display:block}
.proj{display:flex;flex-direction:column;gap:1px}
.projrow{display:flex;align-items:center;border-radius:var(--r)}
.projrow:hover{background:var(--bg)}
.projrow button.pname{display:flex;align-items:center;gap:7px;padding:6px 5px 6px 9px;flex:1;min-width:0;
  text-align:left;font-size:12.5px;color:var(--muted)}
.projrow:hover button.pname,.projrow.on button.pname{color:var(--ink)}
.projrow.on button.pname{font-weight:600}
.projrow.on{background:var(--bg)}
.pname span.pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pedit{width:22px;height:22px;flex:none;display:none;align-items:center;justify-content:center;border-radius:5px;color:var(--muted);margin-right:5px}
.projrow:hover .pedit{display:flex}
.pedit:hover{background:var(--line);color:var(--ink)}
.pedit svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.7}
.dot{width:6px;height:6px;border-radius:2px;background:var(--accent);flex:none}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:1px;padding-top:11px;border-top:1px solid var(--soft)}
.foot button{padding:6px 9px;border-radius:var(--r);text-align:left;font-size:11.5px;color:var(--muted)}
.foot button:hover{background:var(--bg);color:var(--ink)}
.gbox{padding:9px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:11.5px}
.gbox .grow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.gdot{width:7px;height:7px;border-radius:999px;background:#C6CDD3;flex:none}
.gdot.on{background:var(--ok)}
.gdot.err{background:var(--danger)}
.gbtn{width:100%;text-align:center;padding:6px 8px;border:1px solid var(--line);border-radius:5px;font-size:11.5px;color:var(--muted)}
.gbtn:hover{border-color:var(--accent);color:var(--deep)}
.pill.gsrc{background:#E8F0FE;color:#1A56B0}
:root[data-theme="dark"] .pill.gsrc{background:#182338;color:#7AA7F0}

/* main */
.main{overflow:auto;padding:16px 20px 40px;-webkit-overflow-scrolling:touch;min-width:0}
.vhead{display:flex;align-items:baseline;gap:11px;margin-bottom:13px;flex-wrap:wrap}
.vhead h1{font:600 21px/1.1 "Archivo Narrow",sans-serif;margin:0}
.sub{color:var(--muted);font-size:12.5px}
.spacer{margin-left:auto}
.btn{font:var(--label);letter-spacing:.1em;text-transform:uppercase;padding:7px 11px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--deep)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:4px 8px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;background:var(--surface)}
.empty p{margin:0 0 4px;font-weight:600}
.empty span{color:var(--muted);font-size:13px}

/* bulk toolbar */
.bulkbar{display:none;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:var(--r);
  padding:8px 10px;margin-bottom:10px;font-size:12.5px}
.bulkbar.show{display:flex}
.bulkbar b{font-weight:600}
.bulkbar .spacer{margin-left:auto}
.bulkbar select,.bulkbar button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  border-radius:5px;padding:5px 8px;color:#fff;font-size:12px}
.bulkbar button:hover{background:rgba(255,255,255,.24)}

/* rows */
.group{margin-bottom:18px}
.group>.eyebrow{display:block;margin-bottom:6px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-bottom:1px solid var(--soft);cursor:pointer;position:relative}
.row:last-child{border-bottom:none}
.row:hover{background:var(--soft)}
.row.active{background:var(--tint)}
.bulk-cb{width:15px;height:15px;border:1.5px solid #C6CDD3;border-radius:4px;flex:none;margin-top:2px;
  position:relative;opacity:0;transition:.12s}
.row:hover .bulk-cb,.bulkmode .bulk-cb,.row.picked .bulk-cb{opacity:1}
.row.picked .bulk-cb{background:var(--accent);border-color:var(--accent)}
.row.picked .bulk-cb::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:7px;
  border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.check{width:17px;height:17px;border:1.5px solid #B9C2C9;border-radius:5px;flex:none;margin-top:1px;
  position:relative;transition:.15s}
.check:hover{border-color:var(--accent)}
.row.done .check{background:var(--accent);border-color:var(--accent)}
.row.done .check::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.rbody{flex:1;min-width:0}
.title{font-weight:500;word-break:break-word;font-size:13.5px}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
.pill{font:var(--label);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--bg)}
.pill.ctx{background:var(--tint);color:var(--deep)}
.pill.late,.pill.p3{background:#F7E4E2;color:var(--danger)}
.pill.p2{background:#FBF0DC;color:var(--warn)}
.pill.auto{box-shadow:inset 0 0 0 1px currentColor;opacity:.9}
.pill.rt{background:#E8EAF6;color:#3A428A}
.pill.rep{background:#E6F0E9;color:var(--ok)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.editdate{border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:11.5px;background:var(--surface)}

/* calendar */
.calbar{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.calnav{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  width:30px;height:30px;display:grid;place-items:center;color:var(--muted)}
.calnav:hover{color:var(--deep);border-color:var(--accent)}
.calmonth{font:600 16px/1 "Archivo Narrow",sans-serif;letter-spacing:.04em;text-transform:uppercase;min-width:130px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:#F5F7F8;border-bottom:1px solid var(--line)}
.dow div{font:var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:7px;text-align:center;min-width:0}
.weeks{display:grid;grid-template-columns:repeat(7,1fr)}
.day{min-height:98px;min-width:0;overflow:hidden;border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);
  padding:5px 6px;cursor:pointer;position:relative}
.day:nth-child(7n){border-right:none}
.day:hover{background:var(--soft)}
.day.out{background:#FAFBFC}
.day.out .dnum{color:#B9C2C9}
.dnum{font:600 11.5px/1 "Archivo Narrow",sans-serif;color:var(--muted);display:inline-block;margin-bottom:4px}
.day.today .dnum{background:var(--accent);color:#fff;border-radius:999px;padding:3px 6px;margin:-2px 0 3px -2px}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.chip{display:block;width:100%;min-width:0;text-align:left;font-size:11px;line-height:1.3;padding:2px 5px;border-radius:3px;
  margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;
  background:#E0EFEF;color:#094B4F;border-left:2px solid #0E6B70}
.chip.gchip{background:#E8F0FE;color:#1A56B0;border-left-color:#4285F4}
:root[data-theme="dark"] .chip.gchip{background:#182338;color:#7AA7F0}
.chip.life{background:#F6E7EE;color:#632042;border-left-color:#8A2E5D}
.chip.done{opacity:.45;text-decoration:line-through}
.more{font-size:10.5px;color:var(--muted);padding-left:5px}

/* timeline */
.tlwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tlscroll{overflow-x:auto}
.tl{min-width:max-content}
.tlhead{display:flex;background:#F5F7F8;border-bottom:1px solid var(--line)}
.tlrow{display:flex;border-bottom:1px solid var(--soft);min-height:44px}
.tlrow:last-child{border-bottom:none}
.tllabel{width:160px;flex:none;padding:10px 11px;position:sticky;left:0;background:var(--surface);
  border-right:1px solid var(--line);z-index:2;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;cursor:pointer}
.tlhead .tllabel{background:#F5F7F8;font:var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:default}
.tltrack{position:relative;flex:1;display:flex}
.tlcell{width:24px;flex:none;border-right:1px solid var(--soft)}
.tlcell.wk{border-right-color:var(--line)}
.tlcell.we{background:#FAFBFC}
.tlcell.now{background:var(--tint)}
.tlhead .tlcell{padding:5px 0;text-align:center;font:600 9.5px/1.35 "Archivo Narrow",sans-serif;color:var(--muted)}
.tlhead .tlcell .mo{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#9AA5AE}
.bar{position:absolute;top:11px;height:21px;border-radius:3px;display:flex;align-items:center;padding:0 7px;
  color:#fff;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;background:#0E6B70;cursor:pointer}
.bar.life{background:#8A2E5D}
.tick{position:absolute;top:13px;width:13px;height:13px;transform:rotate(45deg);border-radius:2px;
  background:var(--surface);border:2px solid #0E6B70;cursor:pointer;z-index:1}
.tick.life{border-color:#8A2E5D}
.tick.done{background:#0E6B70;opacity:.45}
.tick.late{border-color:var(--danger);background:#F7E4E2}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:10px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;max-height:calc(100dvh - 190px)}
.colhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--soft)}
.colhead .eyebrow{flex:1}
.wip{font:600 10.5px/1 "Archivo Narrow",sans-serif;color:var(--muted)}
.wip.over{color:var(--danger)}
.colbody{padding:7px;overflow-y:auto;flex:1;min-height:60px;display:flex;flex-direction:column;gap:6px}
.col.dragover .colbody{background:var(--tint)}
.card{border:1px solid var(--line);border-radius:var(--r);padding:8px 9px;background:var(--surface);cursor:grab;border-left-width:3px}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--tint)}
.card.dragging{opacity:.4}
.card .title{font-size:12.5px}
.addcard{padding:8px;font-size:11.5px;color:var(--muted);text-align:left;border-top:1px solid var(--soft)}
.addcard:hover{color:var(--deep)}
.swatches{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none;position:relative}
.swatch.sel{border-color:var(--ink)}
.swatch.sel::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px var(--surface) inset}
.swatch.auto{background:var(--bg);border:1px solid var(--line)}
.swatch.auto.sel{border-color:var(--ink)}

/* panels (review/templates/routing) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:13px}
.panel h3{font:600 14px/1.2 "Archivo Narrow",sans-serif;letter-spacing:.05em;text-transform:uppercase;margin:0 0 4px}
.panel p{margin:0 0 9px;font-size:12.5px;color:var(--muted)}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stat b{display:block;font:600 24px/1 "Archivo Narrow",sans-serif}
.stat span{font:var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tpl,.rt{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--soft)}
.tpl:last-child,.rt:last-child{border-bottom:none}
.tpl .g,.rt .g{flex:1;min-width:0}
.tpl .g div{font-size:12px;color:var(--muted);margin-top:2px}
.rt select{border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;font-size:12.5px;background:var(--surface)}
.pjmeta{display:flex;gap:9px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.pjbar{flex:1;max-width:160px;height:5px;border-radius:99px;background:var(--soft);overflow:hidden}
.pjbar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ═══ DETAIL PANE (persistent, right-hand column) ═══ */
.detail{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.detail-empty{margin:auto;text-align:center;padding:30px;color:var(--muted)}
.detail-empty svg{opacity:.35;margin-bottom:10px}
.detail-empty p{margin:0;font-size:13px}
.dpad{padding:15px 17px 24px;display:flex;flex-direction:column;gap:12px}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--soft);position:sticky;top:0;background:var(--surface);z-index:1}
.dhead .spacer{margin-left:auto}
.dtitle{border:none;font-size:16px;font-weight:600;width:100%;padding:2px 0;background:none}
.dtitle:focus{outline:none;border-bottom:1px solid var(--accent)}
.f{display:flex;flex-direction:column;gap:4px}
.f>label{font:var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea,.f select{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:var(--surface);width:100%;font-size:13px}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.f textarea{resize:vertical;min-height:64px;line-height:1.5;font-size:13px}
.richbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;border:1px solid var(--line);border-bottom:none;
  border-radius:var(--r) var(--r) 0 0;background:var(--soft);padding:5px}
.richbar button{min-width:26px;height:26px;padding:0 6px;border-radius:4px;font-size:12.5px;color:var(--ink)}
.richbar button:hover{background:var(--bg)}
.richbar select{height:26px;border:1px solid var(--line);border-radius:4px;font-size:11.5px;background:var(--surface);padding:0 4px}
.richbar .rdiv{width:1px;height:18px;background:var(--line);margin:0 3px;flex:none}
.richbar .rswatch{width:18px;height:18px;min-width:18px;border-radius:3px;border:1px solid rgba(0,0,0,.15);padding:0}
.richbox{border:1px solid var(--line);border-radius:0 0 var(--r) var(--r);padding:9px 10px;min-height:160px;
  font-size:13px;line-height:1.55;background:var(--surface);overflow-y:auto}
.richbox:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.richbox:empty::before{content:attr(data-placeholder);color:var(--muted)}

.richbox h1{font:600 18px/1.3 "Archivo Narrow",sans-serif;margin:10px 0 6px}

.closex:hover{background:var(--bg);color:var(--ink)}

/* generic modal sheet — used for Project/Template/More, and for task detail on narrow screens */
.scrim{position:fixed;inset:0;background:rgba(23,28,34,.44);z-index:60;display:flex;justify-content:center;
  padding:10vh 14px 14px;backdrop-filter:blur(2px)}
.scrim.mid{align-items:center;padding:16px}
.capture{width:100%;max-width:560px;background:var(--surface);border-radius:10px;box-shadow:0 20px 60px rgba(23,28,34,.3);height:max-content;overflow:hidden}
.capture input{width:100%;border:none;padding:16px 18px;font-size:16.5px;background:none}
.capture input:focus{outline:none}
.plan{padding:12px 18px;border-top:1px solid var(--soft);background:var(--soft);font-size:13px;display:none}

.sheet header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--soft);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet header .eyebrow{flex:1}

.primary:hover{background:var(--deep)}

/* ═══ command palette ═══ */
.palette{width:100%;max-width:600px;background:var(--surface);border-radius:10px;box-shadow:0 24px 70px rgba(23,28,34,.34);overflow:hidden;height:max-content;max-height:70vh;display:flex;flex-direction:column}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:90;
  transition:.25s;pointer-events:none;max-width:88vw;text-align:center}

/* mobile fallback */
.fab{position:fixed;right:16px;bottom:calc(70px + var(--safe));width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff;display:none;place-items:center;box-shadow:0 6px 20px rgba(23,28,34,.28);z-index:40}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:none;z-index:41;padding-bottom:var(--safe)}
.tabs .in{display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;
  font:600 10px/1 "Archivo Narrow",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:relative}
.tabs button[aria-current=true]{color:var(--deep)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ≥1180 → 3 columns (sidebar / list / detail, all persistent) */

@media(max-width:720px){
  .app{grid-template-columns:1fr}

<body>
<div class="app" id="appRoot">

</button>

<script>
/* ══════════════════════════════════════════════════════════
   STORAGE
   ══════════════════════════════════════════════════════════ */
const KEY='planner.v3';
const Store=(()=>{
  const mem={};
  const host = typeof window!=='undefined' && window.storage && window.storage.get;
  let ls=false; try{localStorage.setItem('__t','1');localStorage.removeItem('__t');ls=true}catch(e){}
  return{
    mode: host?'host':ls?'local':'memory',
    async get(){try{
      if(host){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null}
      if(ls){const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}
      return mem[KEY]||null;
    }catch(e){return mem[KEY]||null}},
    async set(d){const s=JSON.stringify(d);mem[KEY]=d;try{
      if(host)await window.storage.set(KEY,s); else if(ls)localStorage.setItem(KEY,s);
    }catch(e){console.warn('save failed',e)}}
  };
})();

/* ══════════════════════════════════════════════════════════
   MODEL
   ══════════════════════════════════════════════════════════ */
const uid=()=>Math.random().toString(36).slice(2,10);
const STATUS=[{id:'todo',name:'To do',wip:0},{id:'doing',name:'In progress',wip:5},
              {id:'wait',name:'Waiting on',wip:0},{id:'done',name:'Done',wip:0}];
const ROUTES={task:'Stay in tool',event:'Google Calendar',reminder:'Apple Reminders',note:'Apple Notes'};
const REPEATS=[['','Does not repeat'],['d1','Daily'],['w1','Weekly'],['w2','Every 2 weeks'],
               ['m1','Monthly'],['m3','Quarterly'],['y1','Yearly']];

let S={projects:[],tasks:[],templates:[],meetingSeries:[],meetingNotes:[]};
const GOOGLE_CLIENT_ID='994929569945-shdi5tlk81jvffiua6qpov0fg926h768.apps.googleusercontent.com';
const GOOGLE_SCOPES='https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks.readonly https://www.googleapis.com/auth/drive.appdata';
let gToken=null, gStatus='off', gItems=[], gTokenClient=null, gSilentAttempt=false;
let driveFileId=null, syncState='idle', syncedAt=null, pushTimer=null, pollTimer=null, refreshTimer=null;
try{ driveFileId=localStorage.getItem('planner.driveFileId')||null; }catch(e){}
let theme='light';
try{ theme = localStorage.getItem('planner.theme') || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }catch(e){}
let ctx='work', view='today', projFilter=null, spanBoth=false, query='';
let meetingSeriesId=null, meetingRange='all', meetingQuery='';
let oneOffRange='all', oneOffQuery='';
let openNoteId=null;
let calCursor=som(new Date()), selDay=null;
let selectedId=null;          // task shown in detail pane
let bulkIds=new Set();        // multi-select in inbox/search
const isMid=()=>window.matchMedia('(max-width:1179px)').matches;
const isPhone=()=>window.matchMedia('(max-width:720px)').matches;

/* dates */
function iso(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function parse(s){if(!s)return null;const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function som(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function addM(d,n){const x=new Date(d);x.setMonth(x.getMonth()+n);return x}
function between(a,b){return Math.round((b-a)/864e5)}
function fmtDay(d){return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function relDue(s){
  if(!s)return'';
  const n=between(today(),parse(s));
  if(n===0)return'Today'; if(n===1)return'Tomorrow'; if(n===-1)return'Yesterday';
  if(n<0)return Math.abs(n)+'d overdue'; if(n<7)return'In '+n+'d';
  return parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Rich-text notes: strip tags down to plain text for previews/search. */
function stripHtml(html){
  const tmp=document.createElement('div'); tmp.innerHTML=html||'';
  return (tmp.textContent||'').replace(/\s+/g,' ').trim();
}
/* Sanitize pasted HTML (e.g. from Word) down to a safe structural subset —
   bold/italic/underline/lists/headings/links survive, scripts, inline
   styles, and Word's mso- clutter don't. */
function cleanPastedHtml(html){
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  tmp.querySelectorAll('script,style,link,meta,object,embed,iframe,form,button,input,textarea,select,noscript').forEach(e=>e.remove());
  const allowed=new Set(['P','BR','B','STRONG','I','EM','U','S','STRIKE','UL','OL','LI','A','H1','H2','H3','SPAN','DIV',
    'TABLE','THEAD','TBODY','TFOOT','TR','TD','TH','COL','COLGROUP']);
  const keepAttrs={A:['href'],TD:['colspan','rowspan'],TH:['colspan','rowspan'],COL:['span']};
  tmp.querySelectorAll('*').forEach(el=>{
    const keep=keepAttrs[el.tagName]||[];
    [...el.attributes].forEach(attr=>{
      if(keep.indexOf(attr.name)===-1)el.removeAttribute(attr.name);
    });
    if(!allowed.has(el.tagName)){
      while(el.firstChild)el.parentNode.insertBefore(el.firstChild,el);
      el.remove();
    }
  });
  return tmp.innerHTML;
}
/* A small Word-Home-ribbon-style toolbar for a contenteditable field.
   Uses execCommand — old API, but still the practical way to get real
   bold/italic/list/heading editing without a bundler or a library. */
const RICH_COLORS=['#171C22','#A62B22','#0E6B70','#8A2E5D','#8A5A0B','#3A5FCD'];
function richToolbarHTML(id){
  return '<div class="richbar" data-for="'+id+'">'+
    '<select data-cmd="formatBlock" title="Style">'+
      '<option value="P">Normal</option><option value="H1">Heading 1</option>'+
      '<option value="H2">Heading 2</option><option value="H3">Heading 3</option></select>'+
    '<span class="rdiv"></span>'+
    '<button type="button" data-cmd="bold" title="Bold"><b>B</b></button>'+
    '<button type="button" data-cmd="italic" title="Italic"><i>I</i></button>'+
    '<button type="button" data-cmd="underline" title="Underline"><u>U</u></button>'+
    '<button type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>'+
    '<span class="rdiv"></span>'+
    '<button type="button" data-cmd="insertUnorderedList" title="Bullet list">&#8226;&#8226;&#8226;</button>'+
    '<button type="button" data-cmd="insertOrderedList" title="Numbered list">1.2.</button>'+
    '<span class="rdiv"></span>'+
    '<button type="button" data-cmd="justifyLeft" title="Align left">&#8676;</button>'+
    '<button type="button" data-cmd="justifyCenter" title="Center">&#8596;</button>'+
    '<button type="button" data-cmd="justifyRight" title="Align right">&#8677;</button>'+
    '<span class="rdiv"></span>'+
    RICH_COLORS.map(c=>'<button type="button" data-cmd="foreColor" data-val="'+c+'" class="rswatch" style="background:'+c+'" title="Text color"></button>').join('')+
    '<span class="rdiv"></span>'+
    '<button type="button" data-cmd="createLink" title="Insert link">&#128279;</button>'+
    '<button type="button" data-cmd="removeFormat" title="Clear formatting">Tx</button>'+
    '</div>';
}
function wireRichToolbar(id,onChange){
  const bar=document.querySelector('.richbar[data-for="'+id+'"]');
  const box=document.getElementById(id);
  if(!bar||!box)return;
  bar.addEventListener('mousedown',e=>e.preventDefault()); // keep the selection in the editor
  bar.addEventListener('click',function(e){
    const b=e.target.closest('[data-cmd]'); if(!b)return;
    box.focus();
    const cmd=b.dataset.cmd;
    if(cmd==='createLink'){
      const url=prompt('Link URL');
      if(url)document.execCommand('createLink',false,url);
    } else if(cmd==='formatBlock'){
      return; // handled by the select's own change event below
    } else {
      document.execCommand(cmd,false,b.dataset.val||null);
    }
    onChange();
  });
  const sel=bar.querySelector('select[data-cmd="formatBlock"]');
  if(sel)sel.addEventListener('change',function(){
    box.focus();
    document.execCommand('formatBlock',false,sel.value);
    onChange();
  });
  box.addEventListener('paste',function(e){
    e.preventDefault();
    const cd=e.clipboardData||window.clipboardData;
    const html=cd.getData('text/html');
    const text=cd.getData('text/plain');
    const clean=html?cleanPastedHtml(html):esc(text).replace(/\n/g,'<br>');
    document.execCommand('insertHTML',false,clean);
    onChange();
  });
}

/* ── PROJECT LOCKS — a privacy toggle, not real security.
   The PIN is hashed before storage so it isn't sitting in plain text in
   local storage, but this is a single client-side file: anyone who opens
   developer tools can read the underlying data regardless. This exists
   to stop casual glancing on a shared device, nothing stronger.
   Unlocking is session-only in memory — it re-locks on every reload. */
const unlockedProjects=new Set();
function hashPin(s){
  let h=5381;
  for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0;
  return h.toString(36);
}
const isLocked=id=>{ const p=projOf(id); return !!(p&&p.locked&&!unlockedProjects.has(id)); };
const isLockedTask=t=>t.projectId&&isLocked(t.projectId);
function promptUnlock(id,onSuccess){
  const p=projOf(id); if(!p)return;
  sheet({title:'Locked project',
    body:'<p class="sub" style="margin:0">Enter the PIN to view &ldquo;'+ (p.name?'this project':'it') +'.&rdquo; This only hides it from casual viewing on this device — it isn\u2019t real security.</p>'+
      '<div class="f"><input id="unlockPin" type="password" placeholder="PIN" autocomplete="off"></div>',
    saveLabel:'Unlock',
    onSave:function(el){
      const val=el.querySelector('#unlockPin').value;
      if(hashPin(val)===p.lockHash){ unlockedProjects.add(id); toast('Unlocked'); render(); if(onSuccess)onSuccess(); }
      else toast('Wrong PIN');
    }});
  setTimeout(()=>{const i=document.getElementById('unlockPin'); if(i)i.focus()},50);
}
/* route a task click through the lock check before opening it */
function guardedSelect(id){
  const t=taskById(id); if(!t)return;
  if(isLockedTask(t)){ promptUnlock(t.projectId, ()=>selectTask(id)); return; }
  selectTask(id);
}
/* route a project-edit click through the lock check */
function guardedEditProject(id){
  if(isLocked(id)){ promptUnlock(id, ()=>editProject(id)); return; }
  editProject(id);
}
/* route the sidebar project-name / board-filter click through the lock check */
function guardedOpenProject(id){
  if(isLocked(id)){ promptUnlock(id, ()=>{projFilter=id; go('board')}); return; }
  projFilter=projFilter===id?null:id; go('board');
}

/* selectors */
const inCtx=t=>spanBoth||t.context===ctx;
const live=()=>S.tasks.filter(t=>!t.archived);
const visible=()=>live().filter(t=>inCtx(t)&&(!projFilter||descendantIds(projFilter).indexOf(t.projectId)>-1));
const isLate=t=>t.status!=='done'&&t.due&&parse(t.due)<today();
/* Effective priority = the priority you set, escalated automatically as
   the due date closes in. Never lowers what you chose, only raises it —
   overdue always maxes out, due today/tomorrow bumps toward High, due
   this week gets a small nudge. The stored .priority is untouched, so
   this is purely how urgency is *displayed*, not a silent overwrite. */
function effPriority(t){
  if(!t.due||t.status==='done')return t.priority;
  const d=between(today(),parse(t.due));
  if(d<0)return 3;
  if(d<=1)return Math.max(t.priority,3);
  if(d<=3)return Math.max(t.priority,2);
  return t.priority;
}
function priorityPill(t){
  const ep=effPriority(t);
  if(ep<=1)return'';
  const auto=ep>t.priority;
  return '<span class="pill p'+ep+(auto?' auto':'')+'"'+
    (auto?' title="Priority raised automatically as the due date nears"':'')+'>'+
    (ep===3?'High':'Med')+(auto?' &uarr;':'')+'</span>';
}
const projOf=id=>S.projects.find(p=>p.id===id);
/* Indented label for <select> options so sub-projects are visibly nested
   wherever a task is assigned to a project — dropdown, bulk toolbar, etc. */
const projOptionLabel=p=>(projDepth(p)?'&nbsp;&nbsp;&nbsp;&nbsp;'.repeat(projDepth(p))+'&#8618; ':'')+esc(p.name);
/* Two deliberately distinct families: deep/jewel tones for top-level
   projects, mid-toned brights for sub-projects — chosen so a sub-project
   never reads as "the same color, slightly different" as its parent. */
const PROJECT_COLORS=['#0E6B70','#8A2E5D','#B5541C','#3A5FCD','#2E6B45','#8A5A0B','#6B4FA0','#A62B22','#1A7A9E','#4F7942'];
const SUBPROJECT_COLORS=['#2CB1A3','#D6558C','#E8935A','#5E8FE0','#63B36B','#D9A73B','#9C7FD1','#DE6F63','#3FAACC','#7FB84E'];
const SUB_DEFAULT='#7C93BF'; // unset sub-project color — distinct from every top-level default too
/* A project's board color: its own choice, else a family default —
   sub-projects fall to SUB_DEFAULT rather than inheriting their parent's
   exact color, so nesting stays visually distinguishable at a glance. */
function projColor(p){
  if(!p)return null;
  if(p.color)return p.color;
  if(p.parentId)return SUB_DEFAULT;
  return p.context==='life' ? '#8A2E5D' : '#0E6B70';
}
const childrenOf=id=>S.projects.filter(p=>p.parentId===id);
/* id itself plus every nested sub-project underneath it, any depth. */
function descendantIds(id){
  const out=[id]; const kids=childrenOf(id);
  kids.forEach(k=>{ descendantIds(k.id).forEach(x=>out.push(x)); });
  return out;
}
function projDepth(p){
  let d=0, cur=p, guard=0;
  while(cur&&cur.parentId&&guard++<20){ cur=projOf(cur.parentId); d++; }
  return d;
}
/* Top-level projects first, each immediately followed by its own
   sub-projects (recursively) — keeps parent/child adjacent wherever
   projects are listed. */
function projTree(list){
  const byParent={}; list.forEach(p=>{ (byParent[p.parentId||'']=byParent[p.parentId||'']||[]).push(p); });
  const out=[];
  (function walk(parentId){
    (byParent[parentId||'']||[]).forEach(p=>{ out.push(p); walk(p.id); });
  })('');
  // catch any project whose parent isn't in this filtered list (e.g. parent in other context)
  list.forEach(p=>{ if(out.indexOf(p)===-1)out.push(p); });
  return out;
}
/* Each Google item now carries its own context (which calendar it came
   from), assigned via "Choose calendars" — filter it the same way local
   tasks are filtered. */
const gPool=()=> gItems.filter(t=> spanBoth || t.context===ctx);
const repLabel=r=>{const f=REPEATS.find(x=>x[0]===r);return f?f[1]:'Repeats'};

  return Object.assign({id:uid(),title:'',notes:'',context:ctx,projectId:null,status:'inbox',
    due:null,defer:null,priority:1,tags:[],subtasks:[],repeat:'',route:'task',routed:false,
    createdAt:new Date().toISOString(),completedAt:null,archived:false},p||{});
}
function classify(text,hasDue){
  const s=(text||'').toLowerCase();
  if(/(\d{1,2}(:\d{2})?\s?(am|pm)|\bat \d|\bnoon\b|\bmidnight\b)/.test(s))return'event';
  if(/\b(meeting|meet |call with|appointment|site visit|interview|lunch with|coffee with|webinar|conference|1:1|standup|sync)\b/.test(s))return'event';
  if(/^(note|idea|remember that|fyi|thought)\b/.test(s))return'note';
  if(/\b(read|reference|article|paper|link)\b/.test(s)&&!hasDue)return'note';
  return hasDue?'reminder':'task';
}

function migrate(d){

  d.meetingNotes.forEach(n=>{ if(!('title' in n))n.title=''; if(!('context' in n))n.context=null; if(!('linkedProjectId' in n))n.linkedProjectId=null;
    if(!('attendees' in n))n.attendees=''; if(!('agenda' in n))n.agenda='';
    // notes used to be stored as plain text; anything with no tags at all
    // is almost certainly pre-rich-text and needs escaping before it's
    // ever interpreted as HTML in the new editor.
    if(n.notes&&!/<[a-z][\s\S]*>/i.test(n.notes)) n.notes=esc(n.notes).replace(/\n/g,'<br>');
  });
  d.tasks.forEach(t=>{t.repeat=t.repeat||'';t.route=t.route||'task';t.routed=!!t.routed;

  d.projects.forEach(p=>{ if(!('parentId' in p))p.parentId=null; if(!('color' in p))p.color=''; });
  return d;
}

  const activeProj=projFilter?projOf(projFilter):null;
  const kids=activeProj?childrenOf(activeProj.id):[];
  const grouped=activeProj&&kids.length>0;

  // breadcrumb: walk up from the active project to its top-level ancestor
  let crumbs=[];
  if(activeProj){
    let cur=activeProj, guard=0;
    while(cur){ crumbs.unshift(cur); cur=cur.parentId?projOf(cur.parentId):null; if(guard++>20)break; }
  }
  const breadcrumbHTML=crumbs.length>1
    ? '<div class="sub" style="margin-bottom:9px">'+crumbs.map((c,i)=>
        (i>0?' &rsaquo; ':'')+(i<crumbs.length-1
          ?'<a href="#" data-crumb="'+c.id+'" style="color:var(--muted);text-decoration:underline">'+esc(c.name)+'</a>'
          :'<b style="color:var(--ink)">'+esc(c.name)+'</b>')).join('')+'</div>'
    : '';
  const chipsHTML=grouped
    ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">'+
      kids.map(k=>{
        const n=live().filter(t=>descendantIds(k.id).indexOf(t.projectId)>-1&&t.status!=='done').length;
        return '<button class="btn sm" data-proj="'+k.id+'" style="border-left:3px solid '+projColor(k)+'">'+esc(k.name)+' &middot; '+n+'</button>';
      }).join('')+'</div>'
    : '';

  function colBody(items){
    if(!grouped){
      return items.map(cardHTML).join('');
    }
    // own tasks (directly on the parent) first, then each sub-project as a labeled cluster
    const own=items.filter(t=>t.projectId===activeProj.id);
    let out='';
    if(own.length)out+='<div class="pill" style="margin-bottom:2px">'+esc(activeProj.name)+' (general)</div>'+own.map(cardHTML).join('');
    kids.forEach(k=>{
      const ids=descendantIds(k.id);
      const mine=items.filter(t=>ids.indexOf(t.projectId)>-1);
      if(!mine.length)return;
      out+='<div class="pill" style="margin:'+(out?'8px':'0')+' 0 2px;border-left:3px solid '+projColor(k)+'">'+esc(k.name)+'</div>'+mine.map(cardHTML).join('');
    });
    return out;
  }
  function cardHTML(t){
    if(isLockedTask(t))return '<div class="card" data-id="'+t.id+'"><div class="title" style="color:var(--muted)">&#128274; Locked</div></div>';
    const p=projOf(t.projectId);
    const pc=p?projColor(p):null;
    return '<div class="card '+(selectedId===t.id?'active':'')+'" draggable="true" data-id="'+t.id+'"'+
      (pc?' style="border-left-color:'+pc+'"':'')+'><div class="title">'+esc(t.title)+'</div>'+
      '<div class="meta">'+
      (spanBoth?'<span class="pill ctx">'+(t.context==='work'?'Prof':'Pers')+'</span>':'')+
      priorityPill(t)+
      (t.due?'<span class="'+(isLate(t)?'pill late':'')+'">'+relDue(t.due)+'</span>':'')+
      (t.repeat?'<span class="pill rep">'+repLabel(t.repeat)+'</span>':'')+
      (p&&!grouped?'<span><i style="display:inline-block;width:6px;height:6px;border-radius:999px;background:'+pc+';margin-right:4px;vertical-align:middle"></i>'+esc(p.name)+'</span>':'')+
      (t.subtasks.length?'<span>'+t.subtasks.filter(s=>s.done).length+'/'+t.subtasks.length+'</span>':'')+
      '</div></div>';
  }

  main.innerHTML='<div class="vhead"><h1>'+(activeProj?esc(activeProj.name):(spanBoth?'All projects':(ctx==='work'?'Professional':'Personal')+' board'))+'</h1>'+
    '<span class="sub">'+(grouped?'Combined with '+kids.length+' sub-project'+(kids.length>1?'s':'')+'. Drag between columns.':'Drag between columns.')+'</span>'+
    '<span class="spacer"></span>'+(projFilter?'<button class="btn on" id="clearProj">Clear filter</button>':'')+
    '<button class="btn '+(spanBoth?'on':'')+'" id="both">Both contexts</button></div>'+
  breadcrumbHTML+chipsHTML+
  '<div class="board">'+STATUS.map(c=>{
    const items=l.filter(t=>t.status===c.id), over=c.wip&&items.length>c.wip;
    return '<div class="col" data-col="'+c.id+'"><div class="colhead">'+
      '<span class="eyebrow">'+c.name+'</span><span class="wip '+(over?'over':'')+'">'+
      items.length+(c.wip?' / '+c.wip:'')+'</span></div><div class="colbody">'+
      colBody(items)+
      '</div><button class="addcard" data-add="'+c.id+'">+ Add here</button></div>';
  }).join('')+'</div>';
}

/* ── WEEKLY REVIEW ── */
function vReview(){
  const t=today(), wk=addD(t,-7);
  const closed=live().filter(x=>x.completedAt&&new Date(x.completedAt)>=wk);
  const open=live().filter(x=>x.status!=='done');
  const over=open.filter(x=>x.due&&parse(x.due)<t);
  const stale=open.filter(x=>between(new Date(x.createdAt),t)>=14&&!x.due);
  const undated=open.filter(x=>!x.due&&x.status!=='inbox');
  const wks=[];
  for(let i=5;i>=0;i--){
    const a=addD(t,-7*(i+1)), b=addD(t,-7*i);
    wks.push(live().filter(x=>x.completedAt&&new Date(x.completedAt)>=a&&new Date(x.completedAt)<b).length);
  }
  const peak=Math.max(1,Math.max.apply(null,wks));
  const avg=Math.round(wks.reduce((a,b)=>a+b,0)/6*10)/10;
  main.innerHTML='<div class="vhead"><h1>Weekly review</h1>'+
    '<span class="sub">Fifteen minutes, once a week.</span></div>'+
  '<div class="panel"><div class="stats">'+
    '<div class="stat"><b>'+closed.length+'</b><span>Closed this week</span></div>'+
    '<div class="stat"><b>'+open.length+'</b><span>Still open</span></div>'+
    '<div class="stat"><b style="color:'+(over.length?'var(--danger)':'inherit')+'">'+over.length+'</b><span>Overdue</span></div>'+
    '<div class="stat"><b>'+avg+'</b><span>Avg / week</span></div></div>'+
  '<div style="display:flex;align-items:flex-end;gap:5px;height:40px;margin-top:14px">'+
    wks.map(n=>'<div style="flex:1;background:var(--tint);border-radius:2px;height:'+Math.max(4,n/peak*40)+'px" title="'+n+' closed"></div>').join('')+
    '</div><p style="margin:6px 0 0;font-size:11px">Last six weeks</p></div>'+
  group('Overdue &mdash; reschedule or drop',over)+
  group('Untouched 14+ days',stale)+
  group('No date set',undated)+
  group('Closed this week',closed);
}

/* ── PROJECTS — every open task in this context, grouped by project.
   Stays inside whichever tab you're on (respects the same "Both
   contexts" toggle as Calendar/Timeline) rather than merging Professional
   and Personal by default. Reuses rowHTML so clicking a task opens it
   in the detail pane exactly like everywhere else. */
function vProjects(){
  const projs=projTree(S.projects.filter(p=>spanBoth||p.context===ctx));
  const blocks=projs.map(p=>{
    const depth=projDepth(p);
    const indent=depth?'margin-left:'+(depth*18)+'px;':'';
    if(isLocked(p.id)){
      return '<div class="panel" data-unlockproj="'+p.id+'" style="'+indent+'cursor:pointer;display:flex;align-items:center;gap:10px">'+
        '<div style="flex:1"><h3 style="margin:0;color:var(--muted)">&#128274; Locked project</h3>'+
        '<p style="margin:2px 0 0">Tap to unlock</p></div></div>';
    }
    const parent=p.parentId?projOf(p.parentId):null;
    const ts=live().filter(t=>t.projectId===p.id&&inCtx(t));
    const open=ts.filter(t=>t.status!=='done');
    const done=ts.length-open.length;
    const pct=ts.length?Math.round(done/ts.length*100):0;
    const overdue=open.filter(isLate).length;
    return '<div class="panel" style="'+indent+(depth?'border-left:3px solid '+projColor(p):'')+'">'+
      (parent?'<div class="sub" style="margin-bottom:3px">'+esc(parent.name)+' &rsaquo; sub-project</div>':'')+
      '<div style="display:flex;align-items:center;gap:9px;margin-bottom:2px">'+
      '<h3 style="margin:0;flex:1">'+esc(p.name)+'</h3>'+
      (spanBoth?'<span class="pill ctx">'+(p.context==='work'?'Prof':'Pers')+'</span>':'')+
      '<button class="btn sm" data-editproj="'+p.id+'">Edit</button></div>'+
      '<div class="pjmeta" style="margin-bottom:10px"><span>'+open.length+' open of '+ts.length+'</span>'+
      (overdue?'<span style="color:var(--danger)">'+overdue+' overdue</span>':'')+
      '<div class="pjbar"><i style="width:'+pct+'%"></i></div><span>'+pct+'%</span></div>'+
      (open.length?'<div class="rows">'+open.map(t=>rowHTML(t,false)).join('')+'</div>'
        :'<p class="sub" style="margin:0">Nothing open here.</p>')+
      '</div>';
  }).join('');
  const loose=visible().filter(t=>!t.projectId&&t.status!=='done'&&t.status!=='inbox');
  main.innerHTML='<div class="vhead"><h1>Projects</h1>'+
    '<span class="sub">Every open task, grouped by project, in '+(ctx==='work'?'Professional':'Personal')+'.</span>'+
    '<span class="spacer"></span><button class="btn '+(spanBoth?'on':'')+'" id="both">Both contexts</button></div>'+
    (projs.length?blocks:'<div class="empty"><p>No projects yet.</p><span>Add one, or apply a template.</span></div>')+
    group('Not in a project',loose);
}

/* ══════════════════════════════════════════════════════════
   MEETINGS — recurring meeting "series" (Team sync, 1:1 with X,
   Steering committee...) each with a running, dated log of notes.
   Two levels: a list of series, and a drill-in per series with a
   date-range filter and free-text search over that series' notes.
   ══════════════════════════════════════════════════════════ */
const seriesNotes=id=>S.meetingNotes.filter(n=>n.seriesId===id);
function rangeStart(range){
  const t=today();
  if(range==='30')return addD(t,-30);
  if(range==='90')return addD(t,-90);
  if(range==='ytd')return new Date(t.getFullYear(),0,1);
  return null; // 'all'
}
function vMeetings(){
  if(openNoteId) return vNotePage();
  if(meetingSeriesId) return vMeetingSeries();
  const series=S.meetingSeries.filter(m=>spanBoth||m.context===ctx);

  const oStart=rangeStart(oneOffRange);
  const oq=oneOffQuery.trim().toLowerCase();
  let oneOffs=S.meetingNotes.filter(n=>!n.seriesId&&(spanBoth||n.context===ctx)).sort((a,b)=>b.date.localeCompare(a.date));
  if(oStart)oneOffs=oneOffs.filter(n=>parse(n.date)>=oStart);
  if(oq)oneOffs=oneOffs.filter(n=>((n.title||'')+' '+stripHtml(n.notes)+' '+(n.attendees||'')+' '+n.actionItems.map(a=>a.text).join(' ')).toLowerCase().indexOf(oq)>-1);

  main.innerHTML='<div class="vhead"><h1>Meetings</h1>'+
    '<span class="sub">Recurring meetings, cataloged by type, with a dated log of notes under each.</span>'+
    '<span class="spacer"></span><button class="btn '+(spanBoth?'on':'')+'" id="both">Both contexts</button>'+
    '<button class="btn" id="newSeries">+ New meeting series</button></div>'+
    (series.length?'<div class="panel">'+series.map(m=>{
      const notes=seriesNotes(m.id).sort((a,b)=>b.date.localeCompare(a.date));
      const last=notes[0];
      const openActions=notes.reduce((n,x)=>n+x.actionItems.filter(a=>!a.done).length,0);
      return '<div class="tpl" data-openseries="'+m.id+'" style="cursor:pointer;border-left:3px solid '+(m.color||'#0E6B70')+';padding-left:9px">'+
        '<div class="g"><b>'+esc(m.name)+'</b>'+
        '<div>'+esc(m.cadence||'No cadence set')+' &middot; '+notes.length+' note'+(notes.length===1?'':'s')+
        (last?' &middot; last logged '+relDue(last.date):'')+
        (openActions?' &middot; <span style="color:var(--warn)">'+openActions+' open action item'+(openActions===1?'':'s')+'</span>':'')+
        (spanBoth?' &middot; '+(m.context==='work'?'Professional':'Personal'):'')+'</div></div>'+
        '<button class="btn sm" data-editseries="'+m.id+'">Edit</button></div>';
    }).join('')+'</div>'
    :'<div class="empty"><p>No meeting series yet.</p><span>Add one for each recurring meeting you want to keep notes on.</span></div>')+
    '<div class="vhead" style="margin-top:20px"><h1 style="font-size:17px">One-off meetings</h1>'+
    '<span class="sub">Anything that doesn\u2019t recur \u2014 a vendor call, a one-time review.</span>'+
    '<span class="spacer"></span><button class="btn" id="logOneOff">+ Log one-off meeting</button></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
    '<select id="oRange" style="border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:12.5px;background:var(--surface)">'+
      '<option value="all"'+(oneOffRange==='all'?' selected':'')+'>All time</option>'+
      '<option value="30"'+(oneOffRange==='30'?' selected':'')+'>Last 30 days</option>'+
      '<option value="90"'+(oneOffRange==='90'?' selected':'')+'>Last 90 days</option>'+
      '<option value="ytd"'+(oneOffRange==='ytd'?' selected':'')+'>This year</option></select>'+
    '<input id="oQuery" placeholder="Search one-off meetings\u2026" value="'+esc(oneOffQuery)+'" style="flex:1;min-width:160px;border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:12.5px">'+
    '</div>'+
    (oneOffs.length?'<div class="panel">'+oneOffs.map(n=>{
      const open=n.actionItems.filter(a=>!a.done).length;
      return '<div class="tpl" data-openoneoff="'+n.id+'" style="cursor:pointer">'+
        '<div class="g"><b>'+esc(n.title||'(untitled meeting)')+'</b>'+
        '<div>'+parse(n.date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+
        ' &middot; '+esc(stripHtml(n.notes).slice(0,120)||'(no notes)')+
        (n.attendees?' &middot; <span style="color:var(--muted)">with '+esc(n.attendees)+'</span>':'')+
        (n.actionItems.length?' &middot; '+n.actionItems.length+' action item'+(n.actionItems.length===1?'':'s')+(open?' ('+open+' open)':' (all done)'):'')+
        (spanBoth&&n.context?' &middot; '+(n.context==='work'?'Professional':'Personal'):'')+
        '</div></div><button class="btn sm" data-openoneoff="'+n.id+'">Open</button></div>';
    }).join('')+'</div>'
    :'<div class="empty"><p>No one-off meetings '+(oq||oStart?'match this filter':'logged yet')+'.</p></div>');

  document.getElementById('oRange').onchange=function(e){oneOffRange=e.target.value;vMeetings()};
  const oi=document.getElementById('oQuery');
  oi.focus(); oi.setSelectionRange(oi.value.length,oi.value.length);
  oi.oninput=function(e){oneOffQuery=e.target.value;vMeetings()};
}
function vMeetingSeries(){
  const m=S.meetingSeries.filter(x=>x.id===meetingSeriesId)[0];
  if(!m){meetingSeriesId=null; return vMeetings();}
  const start=rangeStart(meetingRange);
  const q=meetingQuery.trim().toLowerCase();
  let notes=seriesNotes(m.id).sort((a,b)=>b.date.localeCompare(a.date));
  if(start)notes=notes.filter(n=>parse(n.date)>=start);
  if(q)notes=notes.filter(n=>(stripHtml(n.notes)+' '+(n.attendees||'')+' '+n.actionItems.map(a=>a.text).join(' ')).toLowerCase().indexOf(q)>-1);

  main.innerHTML='<div class="vhead">'+
    '<button class="btn sm" id="backToSeries">&larr; All meetings</button>'+
    '<h1 style="margin-left:2px">'+esc(m.name)+'</h1>'+
    '<span class="spacer"></span><button class="btn sm" id="editThisSeries">Edit series</button>'+
    '<button class="btn" id="logNote">+ Log notes</button></div>'+
    '<div class="sub" style="margin-bottom:12px">'+esc(m.cadence||'No cadence set')+
    (m.attendees?' &middot; '+esc(m.attendees):'')+
    (m.linkedProjectId&&projOf(m.linkedProjectId)?' &middot; linked to '+esc(projOf(m.linkedProjectId).name):'')+'</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+
    '<select id="mRange" style="border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:12.5px;background:var(--surface)">'+
      '<option value="all"'+(meetingRange==='all'?' selected':'')+'>All time</option>'+
      '<option value="30"'+(meetingRange==='30'?' selected':'')+'>Last 30 days</option>'+
      '<option value="90"'+(meetingRange==='90'?' selected':'')+'>Last 90 days</option>'+
      '<option value="ytd"'+(meetingRange==='ytd'?' selected':'')+'>This year</option></select>'+
    '<input id="mQuery" placeholder="Search this series\u2019 notes\u2026" value="'+esc(meetingQuery)+'" style="flex:1;min-width:160px;border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:12.5px">'+
    '</div>'+
    (notes.length?'<div class="panel">'+notes.map(n=>{
      const open=n.actionItems.filter(a=>!a.done).length;
      return '<div class="tpl" data-opennote="'+n.id+'" style="cursor:pointer">'+
        '<div class="g"><b>'+parse(n.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})+'</b>'+
        '<div>'+esc(stripHtml(n.notes).slice(0,140)||'(no notes)')+
        (n.attendees?' &middot; <span style="color:var(--muted)">with '+esc(n.attendees)+'</span>':'')+
        (n.actionItems.length?' &middot; '+n.actionItems.length+' action item'+(n.actionItems.length===1?'':'s')+(open?' ('+open+' open)':' (all done)'):'')+
        '</div></div><button class="btn sm" data-opennote="'+n.id+'">Open</button></div>';
    }).join('')+'</div>'
    :'<div class="empty"><p>No notes '+(q||start?'match this filter':'logged yet')+'.</p>'+(q||start?'':'<span>Click \u201c+ Log notes\u201d to start the log.</span>')+'</div>');
  document.getElementById('mRange').onchange=function(e){meetingRange=e.target.value;vMeetingSeries()};
  const qi=document.getElementById('mQuery');
  qi.focus(); qi.setSelectionRange(qi.value.length,qi.value.length);
  qi.oninput=function(e){meetingQuery=e.target.value;vMeetingSeries()};
}
/* ── ONE-OFF MEETING — a dedicated page (not a modal), since notes,
   agenda, and attendees need real room. Fields autosave on blur/change,
   same convention as the task detail pane. Handles both a series
   occurrence and a standalone one-off meeting — the only differences
   are where "Back" goes and whether Context is editable. ── */
function vNotePage(){
  const n=S.meetingNotes.filter(x=>x.id===openNoteId)[0];
  if(!n){ openNoteId=null; return vMeetings(); }
  const m=n.seriesId?S.meetingSeries.filter(x=>x.id===n.seriesId)[0]:null;
  const isOneOff=!n.seriesId;
  const effCtx=isOneOff?n.context:(m?m.context:n.context);
  const ps=S.projects.filter(p=>p.context===(effCtx||ctx));
  const backLabel=isOneOff?'All meetings':(m?esc(m.name):'Meeting series');
  main.innerHTML=
    '<div class="vhead"><button class="btn sm" id="backNote">&larr; '+backLabel+'</button>'+
    (m?'<span class="sub">'+parse(n.date).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</span>':'')+
    '<span class="spacer"></span><button class="del" id="delNote" style="border:1px solid var(--line);border-radius:var(--r);padding:7px 11px">Delete</button></div>'+
    '<input id="ooTitle" value="'+esc(n.title)+'" placeholder="'+(isOneOff?'Meeting title':'Optional label for this occurrence')+'" '+
      'style="font:600 22px/1.2 \'Archivo Narrow\',sans-serif;border:none;background:none;width:100%;padding:2px 0;margin-bottom:14px">'+
    '<div class="grid2" style="margin-bottom:14px">'+
    '<div class="f"><label>Date</label><input type="date" id="ooDate" value="'+n.date+'"></div>'+
    '<div class="f"><label>Context</label><select id="ooCtx"'+(isOneOff?'':' disabled title="Set on the meeting series"')+'>'+
      '<option value="work"'+(effCtx==='work'?' selected':'')+'>Professional</option>'+
      '<option value="life"'+(effCtx==='life'?' selected':'')+'>Personal</option></select></div>'+
    '<div class="f"><label>Attendees</label><input id="ooAttendees" value="'+esc(n.attendees)+'" placeholder="Who was there"></div>'+
    '<div class="f"><label>Related project</label><select id="ooProj"><option value="">None</option>'+
      ps.map(p=>'<option value="'+p.id+'"'+(n.linkedProjectId===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>'+
    '</div>'+
    '<div class="f" style="margin-bottom:14px"><label>Agenda</label><textarea id="ooAgenda" style="min-height:90px" placeholder="What you planned to cover">'+esc(n.agenda)+'</textarea></div>'+
    '<div class="f" style="margin-bottom:14px"><label>Notes</label>'+richToolbarHTML('ooNotes')+
    '<div id="ooNotes" class="richbox" contenteditable="true" data-placeholder="What actually happened">'+(n.notes||'')+'</div></div>'+
    '<div class="f"><label>Action items</label><div class="subs" id="ooActions">'+oneOffActionsHTML(n)+'</div>'+
    '<input id="ooNewAction" placeholder="Add an action item, press Enter"></div>';

  const field=id=>document.getElementById(id);
  const persist=()=>{
    n.title=field('ooTitle').value.trim();
    n.date=field('ooDate').value||n.date;
    if(isOneOff)n.context=field('ooCtx').value;
    n.attendees=field('ooAttendees').value;
    n.linkedProjectId=field('ooProj').value||null;
    n.agenda=field('ooAgenda').value;
    n.notes=field('ooNotes').innerHTML;
    save();
  };
  ['ooTitle','ooAttendees','ooAgenda','ooNotes'].forEach(id=>field(id).addEventListener('blur',persist));
  ['ooDate','ooProj'].forEach(id=>field(id).addEventListener('change',()=>{persist();vNotePage()}));
  if(isOneOff)field('ooCtx').addEventListener('change',()=>{persist();vNotePage()});
  field('ooTitle').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();field('ooTitle').blur()}});
  wireRichToolbar('ooNotes',persist);

  document.getElementById('backNote').onclick=()=>{
    persist();
    if(isOneOff){ openNoteId=null; }
    else { meetingSeriesId=n.seriesId; openNoteId=null; }
    render();
  };
  document.getElementById('delNote').onclick=()=>{
    const backToSeries=n.seriesId;
    S.meetingNotes=S.meetingNotes.filter(x=>x.id!==n.id);
    openNoteId=null; if(backToSeries)meetingSeriesId=backToSeries;
    save(); render(); toast('Notes deleted');
  };
  document.getElementById('ooNewAction').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.value.trim()){
      n.actionItems.push({text:e.target.value.trim(),done:false,taskId:null});
      e.target.value=''; save(); vNotePage();
    }
  });
}
function oneOffActionsHTML(n){
  return n.actionItems.map((a,i)=>'<div class="sub-item '+(a.done?'done':'')+'" data-idx="'+i+'">'+
    '<div class="check" data-actdone="'+i+'"></div><span>'+esc(a.text)+'</span>'+

function editTemplate(id){
  const found=id?S.templates.filter(x=>x.id===id)[0]:null;
  const t=found||{id:null,name:'',context:ctx,days:30,items:[]};
  const text=t.items.map(i=>'+'+i.o+' | '+i.t+(i.p>1?' | !'+i.p:'')).join('\n');
  sheet({title:'Template',
    body:'<div class="f"><label>Name</label><input id="tName" value="'+esc(t.name)+'" placeholder="Evaluation deliverable"></div>'+
      '<div class="f"><label>Tasks &mdash; one per line: <code>+days | title | !priority</code></label>'+
      '<textarea id="tItems" style="min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px">'+esc(text)+'</textarea></div>'+
      '<div class="f"><label>Project length in days</label><input type="number" id="tDays" value="'+t.days+'" min="1"></div>',
    onSave:function(el){
      const items=el.querySelector('#tItems').value.split('\n').map(function(l){
        const p=l.split('|').map(s=>s.trim());
        if(!p[1])return null;
        const o=parseInt((p[0]||'').replace(/[^0-9-]/g,''),10)||0;
        const m=(p[2]||'').match(/!([123])/);
        return{o:o,t:p[1],p:m?+m[1]:1};
      }).filter(Boolean);
      const name=el.querySelector('#tName').value.trim();
      if(!name||!items.length){toast('Give it a name and at least one task');return}
      const days=+el.querySelector('#tDays').value||30;
      if(found){found.name=name;found.items=items;found.days=days}
      else S.templates.push({id:uid(),name:name,context:ctx,days:days,items:items});
      save(); render(); toast('Template saved');
    },
    onDel: found?function(){S.templates=S.templates.filter(x=>x.id!==id);save();render();toast('Template deleted')}:null
  });
}
function applyTemplate(id){
  const t=S.templates.filter(x=>x.id===id)[0]; if(!t)return;
  sheet({title:'Apply template',
    body:'<p class="sub" style="margin:0">Creates a project plus '+t.items.length+' tasks, dated from your anchor.</p>'+
      '<div class="f"><label>Project name</label><input id="aName" value="'+esc(t.name)+'"></div>'+
      '<div class="f"><label>Start date</label><input type="date" id="aDate" value="'+iso(today())+'"></div>',
    saveLabel:'Create',
    onSave:function(el){
      const name=el.querySelector('#aName').value.trim()||t.name;
      const start=parse(el.querySelector('#aDate').value)||today();
      const pid=uid();
      S.projects.push({id:pid,name:name,context:ctx,start:iso(start),end:iso(addD(start,t.days))});
      t.items.forEach(function(i){
        S.tasks.push(newTask({title:i.t,context:ctx,projectId:pid,status:'todo',
          due:iso(addD(start,i.o)),priority:i.p,route:classify(i.t,true)}));
      });
      save(); view='timeline'; render(); toast(name+' created — '+t.items.length+' tasks');
    }});
}

    (o.onDel?'<button class="del" data-del>Delete</button>':'')+'</footer></div>';

function openCapture(presetDue){
  if(document.getElementById('capScrim'))return;
  const el=document.createElement('div'); el.className='scrim'; el.id='capScrim';
  el.innerHTML='<div class="capture">'+
    '<input id="capIn" placeholder="What needs doing?" autocomplete="off">'+
    '<div class="plan" id="plan"></div>'+
    '<div class="caphint"><span><code>!1 !2 !3</code></span><span><code>#tag</code></span>'+
    '<span><code>@today</code> <code>@fri</code> <code>@2026-08-14</code></span>'+
    '<span>'+(ctx==='work'?'Professional':'Personal')+'</span></div></div>';
  document.body.appendChild(el);
  const inp=el.querySelector('#capIn'), plan=el.querySelector('#plan');
  inp.focus();
  let draft=null;
  el.addEventListener('click',function(e){
    if(e.target===el)return el.remove();
    const a=e.target.closest('[data-act]'); if(!a||!draft)return;
    if(a.dataset.act==='cancel'){draft=null;plan.classList.remove('show');inp.value='';inp.focus();return}
    S.tasks.push(draft); save(); render();
    const d=draft;
    if(a.dataset.act==='edit'){el.remove(); selectTask(d.id); return}
    el.remove();
    toast(d.route==='task'?'Added to inbox'
      :d.route==='event'?'Queued for Google Calendar'
      :d.route==='note'?'Queued for Apple Notes':'Queued for Apple Reminders');
  });
  inp.addEventListener('keydown',function(e){
    if(e.key==='Escape')return el.remove();
    if(e.key!=='Enter'||!inp.value.trim())return;
    draft=parseCapture(inp.value,presetDue);
    plan.innerHTML='Going to <b>'+ROUTES[draft.route]+'</b>'+
      (draft.due?' &middot; <b>'+relDue(draft.due)+'</b>':'')+
      (effPriority(draft)>1?' &middot; <b>'+(effPriority(draft)===3?'High':'Medium')+'</b>':'')+
      '<div style="margin-top:5px;color:var(--muted)">'+esc(draft.title)+'</div>'+
      '<div class="opts"><button class="primary" data-act="ok">Confirm</button>'+
      '<button class="btn" data-act="edit">Change details</button>'+
      '<button class="btn" data-act="cancel">Cancel</button></div>';
    plan.classList.add('show');
    plan.querySelector('[data-act=ok]').focus();
  });
}
function parseCapture(raw,presetDue){
  let s=raw, prio=1, tags=[], due=presetDue||null;
  s=s.replace(/!([123])\b/g,function(_,d){prio=+d;return''});
  s=s.replace(/#(\S+)/g,function(_,g){tags.push(g);return''});
  s=s.replace(/@(\S+)/g,function(m,d){const p=parseWhen(d); if(p){due=p;return''} return m});
  const title=s.replace(/\s+/g,' ').trim();
  return newTask({title:title,priority:prio,tags:tags,due:due,
    route:classify(title,!!due), status:due?'todo':'inbox'});
}
function parseWhen(w){
  const t=today(), l=w.toLowerCase();
  if(/^\d{4}-\d{2}-\d{2}$/.test(w))return w;
  if(l==='today')return iso(t);
  if(l==='tomorrow'||l==='tmw')return iso(addD(t,1));
  const days=['sun','mon','tue','wed','thu','fri','sat'], i=days.indexOf(l.slice(0,3));
  if(i>-1)return iso(addD(t,(i-t.getDay()+7)%7||7));
  const m=l.match(/^(\d+)([dwm])$/);
  if(m)return m[2]==='m'?iso(addM(t,+m[1])):iso(addD(t,+m[1]*(m[2]==='w'?7:1)));
  return null;
}

function openPalette(){
  closePalette();
  const el=document.createElement('div'); el.className='scrim mid'; el.id='paletteScrim';
  el.innerHTML='<div class="palette"><input id="pIn" placeholder="Jump to a view, run a command, or search tasks&hellip;"><div class="pitems" id="pItems"></div></div>';
  document.body.appendChild(el);
  const inp=el.querySelector('#pIn'), items=el.querySelector('#pItems');
  let sel=0, list=[];
  function renderItems(){
    const q=inp.value.trim().toLowerCase();
    const cmds=paletteCommands().filter(c=>!q||c.label.toLowerCase().indexOf(q)>-1);
    const tasks=q?live().filter(t=>!isLockedTask(t)&&t.title.toLowerCase().indexOf(q)>-1).slice(0,6):[];
    list=cmds.map(c=>({type:'cmd',...c})).concat(tasks.map(t=>({type:'task',label:t.title,task:t})));
    sel=0;
    items.innerHTML=
      (cmds.length?'<div class="pgroup">Commands</div>'+cmds.map((c,i)=>pitemHTML(c.label,i)).join(''):'')+
      (tasks.length?'<div class="pgroup">Tasks</div>'+tasks.map((t,i)=>pitemHTML(t.title,cmds.length+i)).join(''):'')+
      (!list.length?'<div class="pgroup">No matches</div>':'');
    mark();
  }
  function pitemHTML(label,i){
    return '<div class="pitem" data-i="'+i+'"><svg class="pico" viewBox="0 0 20 20"><path d="M6 10l3 3 5-6"/></svg>'+esc(label)+'</div>';
  }
  function mark(){items.querySelectorAll('.pitem').forEach((el,i)=>el.classList.toggle('sel',i===sel));
    const s=items.querySelector('.pitem.sel'); if(s)s.scrollIntoView({block:'nearest'})}
  function choose(i){
    const it=list[i]; if(!it)return;
    closePalette();
    if(it.type==='cmd')it.run(); else selectTask(it.task.id);
  }
  inp.addEventListener('input',renderItems);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Escape')return closePalette();
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(list.length-1,sel+1);mark();return}
    if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);mark();return}
    if(e.key==='Enter'){e.preventDefault();choose(sel);return}
  });
  items.addEventListener('click',e=>{const p=e.target.closest('[data-i]');if(p)choose(+p.dataset.i)});
  el.addEventListener('click',e=>{if(e.target===el)closePalette()});
  renderItems(); inp.focus();
}
function closePalette(){const e=document.getElementById('paletteScrim'); if(e)e.remove()}

/* ══════════════════════════════════════════════════════════
   COMPLETION + RECURRENCE
   ══════════════════════════════════════════════════════════ */
function toggleDone(id){
  const t=taskById(id); if(!t)return;
  if(t.status==='done'){t.status='todo';t.completedAt=null;save();return render()}
  t.status='done'; t.completedAt=new Date().toISOString();
  if(t.repeat&&t.due){
    const n=nextDue(t.due,t.repeat);
    S.tasks.push(newTask({title:t.title,notes:t.notes,context:t.context,projectId:t.projectId,
      status:'todo',due:n,priority:t.priority,tags:t.tags.slice(),repeat:t.repeat,route:t.route,
      subtasks:t.subtasks.map(s=>({text:s.text,done:false}))}));
    toast('Done — next one set for '+relDue(n));
  }
  save(); render();
}
function nextDue(due,rep){
  const d=parse(due), n=+rep.slice(1), k=rep[0];
  return k==='d'?iso(addD(d,n)):k==='w'?iso(addD(d,7*n)):k==='m'?iso(addM(d,n)):iso(addM(d,12*n));
}

/* ══════════════════════════════════════════════════════════
   AI PLANNING
   ══════════════════════════════════════════════════════════ */
const AI_KEY_STORAGE='planner.aiKey';
function getAIKey(){ try{return localStorage.getItem(AI_KEY_STORAGE)||''}catch(e){return ''} }
function setAIKey(k){ try{ if(k)localStorage.setItem(AI_KEY_STORAGE,k); else localStorage.removeItem(AI_KEY_STORAGE) }catch(e){} }
const AI_PLAN_SCHEMA={
  type:'object',
  properties:{
    project:{type:'object',properties:{name:{type:'string'}},required:['name'],additionalProperties:false},
    tasks:{type:'array',items:{type:'object',properties:{
      title:{type:'string'},
      notes:{type:'string'},
      dueInDays:{type:'integer'},
      priority:{type:'integer',enum:[1,2,3]}
    },required:['title','notes','dueInDays','priority'],additionalProperties:false}}
  },
  required:['project','tasks'],
  additionalProperties:false
};
async function callClaudeForPlan(goal){
  const key=getAIKey();
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:'claude-opus-5',
      max_tokens:4096,
      output_config:{effort:'medium',format:{type:'json_schema',schema:AI_PLAN_SCHEMA}},
      messages:[{role:'user',content:
        'Break the following goal into a project with a short name (max 6 words) and a list of '+
        '4-10 concrete, actionable tasks. For each task give a short title, one-sentence notes, '+
        'dueInDays (integer days from today a sensible deadline for that step, 0 if today, in '+
        'increasing order reflecting a realistic sequence), and priority (1=normal, 2=medium, '+
        '3=high; use 3 sparingly for true blockers). Goal: '+goal}]
    })
  });
  if(!res.ok){
    let msg='Request failed ('+res.status+')';
    try{ const j=await res.json(); if(j&&j.error&&j.error.message)msg=j.error.message }catch(e){}
    throw new Error(msg);
  }
  const data=await res.json();
  const block=(data.content||[]).filter(b=>b.type==='text')[0];
  if(!block)throw new Error('No plan returned');
  return JSON.parse(block.text);
}
function openAIPlan(){
  const savedKey=getAIKey();
  sheet({title:'Plan with AI',
    body:
      (savedKey?'':
        '<div class="f"><label>Anthropic API key</label><input id="aiKeyIn" type="password" placeholder="sk-ant-...">'+
        '<p class="sub" style="margin:4px 0 0">Stored only in this browser (localStorage). Get one at '+
        '<code>console.anthropic.com</code>.</p></div>')+
      '<div class="f"><label>What do you want to plan?</label>'+
      '<textarea id="aiGoalIn" rows="3" placeholder="e.g. Launch the Q3 customer report by end of month"></textarea></div>',
    saveLabel:'Generate plan',
    onSave:function(el){
      const keyField=el.querySelector('#aiKeyIn');
      const key=keyField?keyField.value.trim():savedKey;
      const goal=el.querySelector('#aiGoalIn').value.trim();
      if(!goal)return toast('Describe what you want to plan first');
      if(!key)return toast('Add your Anthropic API key first');
      setAIKey(key);
      toast('Planning…');
      callClaudeForPlan(goal).then(function(plan){
        openAIPlanReview(plan);
      }).catch(function(err){
        toast('AI planning failed: '+err.message);
      });
    }});
}
function openAIPlanReview(plan){
  const tasks=(plan.tasks||[]).slice(0,20);
  sheet({title:'Review AI plan',
    body:
      '<div class="f"><label>Project name</label><input id="aiProjName" value="'+esc(plan.project&&plan.project.name||'New project')+'"></div>'+
      '<div class="f"><label>Tasks &mdash; uncheck any to skip</label>'+
      '<div style="display:flex;flex-direction:column;gap:6px">'+
      tasks.map((t,i)=>'<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px">'+
        '<input type="checkbox" checked data-aitask="'+i+'" style="margin-top:3px">'+
        '<span><b>'+esc(t.title||'Untitled task')+'</b>'+
        (t.notes?' &mdash; '+esc(t.notes):'')+
        ' <span style="color:var(--muted)">('+relDue(iso(addD(today(),+t.dueInDays||0)))+
        (t.priority>1?', '+(t.priority===3?'High':'Medium'):'')+')</span></span></label>').join('')+
      '</div></div>',
    saveLabel:'Add to '+(ctx==='work'?'Professional':'Personal'),
    onSave:function(el){
      const name=el.querySelector('#aiProjName').value.trim()||'New project';
      const t0=today();
      const pid=uid();
      S.projects.push({id:pid,name:name,context:ctx,start:iso(t0),end:iso(addD(t0,60)),parentId:null,color:''});
      let added=0;
      tasks.forEach(function(t,i){
        const cb=el.querySelector('[data-aitask="'+i+'"]');
        if(!cb||!cb.checked)return;
        const due=iso(addD(t0,+t.dueInDays||0));
        S.tasks.push(newTask({title:t.title||'Untitled task',notes:t.notes||'',context:ctx,
          projectId:pid,status:'todo',due:due,priority:Math.min(3,Math.max(1,+t.priority||1)),
          route:classify(t.title||'',true)}));
        added++;
      });
      save(); render(); toast('Added "'+name+'" with '+added+' task'+(added===1?'':'s'));
    }});
}
